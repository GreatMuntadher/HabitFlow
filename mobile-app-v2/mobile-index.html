<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#07070e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>HabitFlow — الموبايل</title>
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="mobile-style.css">
</head>
<body>

<div id="m-app">

  <!-- خلفية فضائية خفيفة — طبقات ثابتة، بدون أنيميشن ثقيل -->
  <div id="m-bg" aria-hidden="true"></div>

  <!-- رأس الصفحة -->
  <header class="m-topbar">
    <div class="m-topbar-title">
      <span class="m-topbar-name">HabitFlow</span>
      <span class="m-topbar-date" id="m-topbar-date"></span>
    </div>
    <div class="m-topbar-ring" id="m-topbar-ring">
      <svg viewBox="0 0 40 40" width="38" height="38">
        <circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/>
        <circle id="m-ring-fill" cx="20" cy="20" r="16" fill="none" stroke="url(#mRingGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="100.5" stroke-dashoffset="100.5" transform="rotate(-90 20 20)"/>
        <defs><linearGradient id="mRingGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c4b5fd"/><stop offset="100%" stop-color="#818cf8"/></linearGradient></defs>
      </svg>
      <span class="m-ring-pct" id="m-ring-pct">0%</span>
    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="m-main" id="m-main">

    <!-- الرئيسية -->
    <section class="m-page active" id="m-page-home" data-page="home"></section>

    <!-- تسجيل اليوم -->
    <section class="m-page" id="m-page-daily" data-page="daily"></section>

    <!-- المهام -->
    <section class="m-page" id="m-page-tasks" data-page="tasks"></section>

    <!-- العادات -->
    <section class="m-page" id="m-page-habits" data-page="habits"></section>

    <!-- المذكرات -->
    <section class="m-page" id="m-page-journal" data-page="journal"></section>

    <!-- التقارير -->
    <section class="m-page" id="m-page-reports" data-page="reports"></section>

    <!-- المزيد -->
    <section class="m-page" id="m-page-more" data-page="more"></section>

  </main>

  <!-- شريط تنقل سفلي ثابت -->
  <nav class="m-nav" id="m-nav">
    <button class="m-nav-item active" data-nav="home" type="button">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>الرئيسية</span>
    </button>
    <button class="m-nav-item" data-nav="daily" type="button">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M8 2v4M16 2v4M7 13h4M7 17h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>تسجيل اليوم</span>
    </button>
    <button class="m-nav-item" data-nav="tasks" type="button">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 11l3 3L22 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>المهام</span>
    </button>
    <button class="m-nav-item" data-nav="journal" type="button">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 19.5A2.5 2.5 0 016.5 17H20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>المذكرات</span>
    </button>
    <button class="m-nav-item m-nav-more" data-nav="more" type="button">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></svg>
      <span>المزيد</span>
    </button>
  </nav>

  <!-- ورقة سفلية عامة (لإضافة مهمة / تدوينة) -->
  <div class="m-sheet-overlay" id="m-sheet-overlay">
    <div class="m-sheet" id="m-sheet">
      <div class="m-sheet-handle"></div>
      <div class="m-sheet-body" id="m-sheet-body"></div>
    </div>
  </div>

  <!-- تنبيه صغير (toast) -->
  <div class="m-toast" id="m-toast"></div>

</div>

<script src="mobile-app.js"></script>
</body>
</html>
